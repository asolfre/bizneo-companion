name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS)
    # Preview image, same Xcode as local development. Keep runner, DEVELOPER_DIR and
    # the Xcode check in sync with release.yml; fallback in AGENTS.md.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      UNIVERSAL: 1
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version | tee /dev/stderr | grep '^Xcode 27\.1' >/dev/null

      - name: Build (debug)
        run: swift build

      - name: Test (XCTest)
        run: swift test

      - name: Self-test (parsers / calculator / chrono / year)
        run: swift run BizneoCompanion --selftest Tests/BizneoCompanionTests/Fixtures

      - name: Package .app (universal)
        run: ./build_app.sh

      - name: Check the app
        run: |
          app=BizneoCompanion.app
          for arch in arm64 x86_64; do
            lipo "$app/Contents/MacOS/BizneoCompanion" -verify_arch "$arch" ||
              { echo "::error::app lacks $arch"; exit 1; }
          done
          codesign --verify --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' -c 'Print CFBundleVersion' "$app/Contents/Info.plist"
