name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test (XCTest)
        run: swift test

      - name: Self-test (parsers / calculator / chrono / year)
        run: swift run BizneoCompanion --selftest Tests/BizneoCompanionTests/Fixtures

      - name: Package .app
        run: ./build_app.sh
